# VirtualHost WampServer pour Barkewl (frontend statique + proxy API Django)
#
# A coller dans C:\wamp64\bin\apache\apache<version>\conf\extra\httpd-vhosts.conf
# (ou via le menu Wamp : clic gauche icone > Apache > httpd-vhosts.conf)
#
# Utilise le port 8080 (et non 80) pour ne pas toucher au vhost "localhost" par
# defaut de Wamp (qui sert phpMyAdmin etc. sur http://localhost/). Il faut donc
# aussi ajouter "Listen 8080" dans httpd.conf (voir DEPLOY.md section 6).
#
# Adapter le chemin "C:/Users/.../Barkewl/frontend/dist" a l'emplacement reel sur ce PC.
# Aucune modification du fichier hosts n'est necessaire : "localhost" existe deja.

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/Users/hpi7/Desktop/Rawafid/Barkewl/frontend/dist"

    <Directory "C:/Users/hpi7/Desktop/Rawafid/Barkewl/frontend/dist">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Fallback SPA : toute route inconnue (React Router) renvoie index.html
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_URI} ^/api
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    # Proxy vers le backend Django (Waitress sur 127.0.0.1:8000)
    # Necessite les modules Apache "proxy" et "proxy_http" actives (menu Wamp > Apache > Modules Apache)
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ErrorLog "logs/barkewl-error.log"
    CustomLog "logs/barkewl-access.log" common
</VirtualHost>
