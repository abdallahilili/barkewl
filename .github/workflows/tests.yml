# RAQEEM PHARMA - tests automatiques à chaque envoi sur GitHub (push) et chaque demande de fusion.
# Résultat visible dans l'onglet « Actions » du dépôt (coche verte = tout passe).
name: Tests

on:
  push:
  pull_request:

jobs:
  serveur:
    name: Serveur (Django) - SQLite et MySQL 8.0
    runs-on: ubuntu-latest
    services:
      # MySQL 8.0 : la version la plus ancienne acceptée chez les clients (WampServer).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: racine
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pracine"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      CLE_SECRETE: cle-de-test-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bibliothèques système (mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - name: Composants Python
        run: pip install -r requirements.txt
      - name: Vérification Django
        run: python manage.py check
        env:
          UTILISER_SQLITE: "1"
      - name: Migrations à jour (aucune modification de modèle oubliée)
        run: python manage.py makemigrations --check --dry-run
        env:
          UTILISER_SQLITE: "1"
      - name: Tests sur SQLite
        run: python manage.py test apps.tests
        env:
          UTILISER_SQLITE: "1"
      - name: Tests sur MySQL 8.0
        run: python manage.py test apps.tests --noinput
        env:
          BD_HOTE: 127.0.0.1
          BD_PORT: "3306"
          BD_UTILISATEUR: root
          BD_MOT_DE_PASSE: racine
          BD_NOM: raqeem

  interface:
    name: Interface (React) - TypeScript et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vérification TypeScript
        run: npx tsc --noEmit
      - name: Tests (dont le contrôle des traductions arabes)
        run: npx vitest run
